<div class="p-2">
  <h2>Gestion de mon livre</h2>
  <hr>

  <div class="alert alert-danger mt-2" role="alert" *ngIf="errorMessage.length">
    <p class="p-0 m-0" *ngFor="let message of errorMessage">{{ message }}</p>
  </div>

  <div class="d-flex gap-2">
    <div class="col-3">
      <img class="rounded-1" width="100%" height="100%" [src]="selectedPicture || 'https://picsum.photos/1900/800?random=1'" alt="...">
      <div class="mt-2">
        <input class="form-control" type="file" id="formFile" accept="image/*" (change)="onFileSelected($event)">
      </div>
    </div>

    <div class="col-9">
      <form class="row g-3">
        <div class="col-12">
          <label for="title" class="form-label">Titre</label>
          <input [(ngModel)]="bookRequest.title" type="text" class="form-control" id="title" name="title" placeholder="Titre du livre">
        </div>
        <div class="col-6">
          <label for="author" class="form-label">Auteur</label>
          <input [(ngModel)]="bookRequest.authorName" type="text" class="form-control" id="author" name="author" placeholder="Nom de l'auteur">
        </div>
        <div class="col-6">
          <label for="isbn" class="form-label">ISBN</label>
          <input [(ngModel)]="bookRequest.isbn" type="text" class="form-control" id="isbn" name="isbn" placeholder="ISBN">
        </div>
        <div class="col-12">
          <label for="synopsis" class="form-label">Synopsis</label>
          <textarea [(ngModel)]="bookRequest.synopsis" rows="4" class="form-control" id="synopsis" name="synopsis" placeholder="Synopsis du livre"></textarea>
        </div>
        <div class="col-12">
          <input [(ngModel)]="bookRequest.shareable" class="form-check-input" type="checkbox" id="shareable" name="shareable">
          <label for="shareable" class="form-check-label">Partageable</label>
        </div>
        <div class="d-flex justify-content-end gap-2 col-12">
          <button type="submit" class="btn btn-outline-primary" (click)="saveBook()">
            <i class="fas fa-save"></i>&nbsp;Enregistrer
          </button>
          <a routerLink="/books/my-books" class="btn btn-link text-danger">
            <i class="fas fa-times"></i>&nbsp;Annuler
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
