<h2>La liste de mes livres rendus</h2>

<div *ngIf="message"
     class="alert"
     [class.alert-danger] = "level == 'error'"
     [class.alert-success] ="level == 'success'">
  {{ message }}
</div>

<div>
  <table class="table">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Titre</th>
      <th scope="col">Auteur</th>
      <th scope="col">ISBN</th>
      <th scope="col">Note</th>
      <th scope="col">
        <i class="fas fa-cogs"></i>
      </th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let book of returnedBooks.content; let index = index">
      <th scope="row">{{ index + 1 }}</th>
      <td>{{ book.title }}</td>
      <td>{{ book.authorName }}</td>
      <td>{{ book.isbn }}</td>
      <td><i class="fas fa-star text-warning"></i>{{ book.rate }}</td>
      <td>
        <div class="d-flex gap-2">
          <i *ngIf="book.returned" class="fa-regular fa-paper-plane text-primary cursor-pointer"></i>
          <i *ngIf="!book.returned" class="fa-solid fa-paper-plane text-success cursor-pointer"></i>
          <i class="fa-solid fa-circle-check cursor-pointer" [class.text-success]="book.returnApproved" (click)="approveBookReturn(book)"></i>
        </div>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page de navigation">
      <ul class="pagination">
        <li class="page-item">
          <a class="page-link"  href="javascript:void(0)" aria-label="Précédent" (click)="gotToFirstPage()" [class.disabled]="page == 0">
            <i class="fa-solid fa-angles-left"></i>
          </a>
        </li>
        <li class="page-item">
          <a class="page-link"  href="javascript:void(0)" aria-label="Précédent" (click)="gotToPreviousPage()" [class.disabled]="page == 0">
            <i class="fa-solid fa-angle-left"></i>
          </a>
        </li>

        <li class="page-item" *ngFor="let _ of [].constructor(this.returnedBooks.totalPages); let pageIndex = index">
          <a class="page-link"  href="javascript:void(0)" aria-label="Précédent" (click)="gotToPage(pageIndex)" [class.active]="page == pageIndex">
            {{ pageIndex + 1 }}
          </a>
        </li>

        <li class="page-item">
          <a class="page-link"  href="javascript:void(0)" aria-label="Suivant" (click)="gotToNextPage()" [class.disabled]="isLastPage">
            <i class="fa-solid fa-chevron-right"></i>
          </a>
        </li>

        <li class="page-item">
          <a class="page-link"  href="javascript:void(0)" aria-label="Bouton précédent" (click)="gotToLastPage()" [class.disabled]="isLastPage">
            <i class="fa-solid fa-angles-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
