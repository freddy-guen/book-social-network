<div class="card" style="width: 20rem;">
  <img class="card-img-top" alt="..." [src]="bookCover" height="200">
  <div class="card-body">
    <!-- Titre du livre-->
    <h5 class="card-title fs-6 text-nowrap fw-bold mb-1">
      <i class="fa-solid fa-book"></i>&nbsp;
      {{ book.title }}
    </h5>

    <!-- Auteur du livre-->
    <h5 class="card-subtitle fs-6 text-secondary mb-1">
      <i class="fa-solid fa-user-edit"></i>&nbsp;
      {{ book.authorName }}
    </h5>

    <!-- ISBN du livre-->
    <h6 class="card-subtitle fs-6 text-secondary mb-1">
      <i class="fas fa-code"></i>&nbsp;
      {{ book.isbn }}
    </h6>

    <!-- ISBN du livre-->
    <h6 class="card-subtitle fs-6 text-secondary">
      <i class="fas fa-user"></i>&nbsp;
      {{ book.ownerName }}
    </h6>

    <!-- Synopsis/résumé du livre-->
    <hr>
    <p class="card-text synopsis">{{ book.synopsis }}</p>
  </div>

  <div class="card-footer d-flex gap-2 justify-content-between align-items-center">
    <div class="d-flex gap-2">
      <app-rating [rating]="book.rate || 0"></app-rating>
      <span class="fw-bold" *ngIf="book.rate || 0 > 0">
        {{ book.rate }}
      </span>
    </div>

    <div class="d-flex gap-2" *ngIf="!manage">
      <i class="fas fa-circle-info text-primary" (click)="onShowDetails()"></i>
      <i class="fas fa-list-check text-primary" (click)="onBorrow()"></i>
      <i class="fas fa-heart text-danger" (click)="onAddToWaitingList()"></i>
    </div>

    <!-- Si propiétaire alors droit de pouvoir accéder aux icones d'édition, partage... -->
    <!-- Visible seulement via l'onglet "Mes livres" -->
    <div class="d-flex gap-2" *ngIf="manage">
      <i class="fas fa-edit text-success" (click)="onEdit()"></i>
      <i class="fas fa-share-nodes text-primary" (click)="onShare()"></i>
      <i class="fas fa-archive text-danger" (click)="onArchive()"></i>
    </div>
  </div>
</div>
