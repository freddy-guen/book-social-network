<div class="container-fluid car login-container">
  <h3>Connexion</h3>
  <hr>

  <div class="alert alert-danger" role="alert" *ngIf="errorMessage.length">
    <p *ngFor="let message of errorMessage">{{ message }}</p>
  </div>

  <div class="mb-3">
    <label for="login" class="form-label" >Email</label>
    <input [(ngModel)]="authRequest.email" type="email" class="form-control" id="login" placeholder="name@example.com">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Mot de passe</label>
    <input [(ngModel)]="authRequest.password" type="password" class="form-control" id="password" placeholder="">
  </div>

  <div class="d-flex justify-content-between mb-3">
    <button type="button" class="btn btn-primary" (click)="login()">
      <em class="fas fa-sign-in-alt">&nbsp;Se connecter</em>
    </button>

    <!-- Option pour basculer à la page d'inscrire dépuis l'écran de connexion -->
    <div>
      Vous n'avez pas encore de compte ?&nbsp;
      <button type="button" class="btn btn-link" (click)="register()">
        Inscrivez-vous ici
      </button>
    </div>
  </div>
</div>
